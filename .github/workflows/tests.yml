name: Python tests

on:
  push:
    branches: [main, feature/signal-outcome-tracking-20261024]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
